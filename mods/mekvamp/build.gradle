plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
def modProperties = new Properties()
file('gradle.properties').withInputStream { modProperties.load(it) }
modProperties.each { key, value -> extensions.extraProperties.set(key, value) }
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets.main.resources { srcDir 'src/generated/resources' }
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.createmod.net'; content { includeGroup 'net.createmod.ponder'; includeGroup 'dev.engine-room.flywheel' } }
    maven { url = 'https://maven.ithundxr.dev/snapshots'; content { includeGroup 'com.tterrag.registrate' } }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}

dependencies {
    compileOnly('maven.modrinth:Ce6I4WUE:5KzzycBT') { transitive = false }
    compileOnly('maven.modrinth:vampirism:kIXSjBpi') { transitive = false }
}

tasks.withType(ProcessResources).configureEach {
    inputs.properties(modProperties)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand(modProperties) }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE')
}

neoForge { unitTest { enable(); testedMod = mods.mekvamp } }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.neoforged:testframework:21.1.236'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
configurations.testCompileOnly.extendsFrom(configurations.compileOnly)
tasks.withType(Test).configureEach { useJUnitPlatform(); testLogging { events 'failed', 'skipped' } }

dependencies {
    runtimeOnly('maven.modrinth:Ce6I4WUE:5KzzycBT') { transitive = false }
    runtimeOnly('maven.modrinth:vampirism:kIXSjBpi') { transitive = false }
}

tasks.withType(Test).configureEach { timeout = java.time.Duration.ofMinutes(5) }
